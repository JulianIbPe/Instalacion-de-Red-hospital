<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Topologías de red</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/barra.css">
<link rel="stylesheet" href="css/menu.css">
<link rel="stylesheet" href="css/lienzo.css">
<link rel="stylesheet" href="css/plantas.css">
<link rel="stylesheet" href="css/dialogo.css">
</head>
<body>
<header id="top">
  <b class="logo" title="Topologías de red">🌐 Redes</b>
  <div class="grp"><label>Edificio <input id="bw" type="number" value="20" min="1" step="0.5"> × <input id="bh" type="number" value="12" min="1" step="0.5"> m</label><button id="bset">Aplicar</button></div>
  <div class="grp"><button id="bsel" title="Seleccionar y mover objetos (Esc)">🖱️ Seleccionar</button><button id="bmed" title="Medir de un punto a otro">📏 Medir</button><button id="bgrid" class="on" title="Mostrar u ocultar la grilla y ajustar los objetos a ella (G)">▦ Grilla</button><button id="bmid" title="Imán al punto medio: el cursor se pega a la mitad de líneas, paredes y lados de formas (tecla M)">◇ Medio</button><button id="unit" title="Unidad de las PRÓXIMAS mediciones (las ya hechas no cambian)">Medir en: m</button></div>
  <div class="grp"><button id="bundo" title="Deshacer (Ctrl+Z)">↶</button><button id="bredo" title="Rehacer (Ctrl+Y)">↷</button><button id="bdel" title="Borrar el objeto seleccionado (Supr)">🗑️ Borrar</button></div>
  <span class="sp"></span>
  <div class="grp last"><button id="bnew" title="Empezar un archivo nuevo">📄 Nuevo</button><button id="save" class="prim" title="Descargar la topología como archivo .json">💾 Guardar</button><button id="load" title="Abrir un archivo .json guardado">📂 Abrir</button><button id="png" title="Exportar la topología como imagen PNG">🖼️ PNG</button></div>
  <input type="file" id="file" accept=".json" hidden>
</header>
<div id="main">
  <nav id="side">
    <div id="tabs"></div>
    <div id="items"></div>
    <div id="opts">
      <label>Color <input id="col" type="color" value="#2e86de"></label>
      <label>Relleno
        <select id="fill"><option value="sol">Sólido</option><option value="hat">Líneas diagonales</option><option value="non">Sin relleno</option></select>
      </label>
      <label>Línea
        <select id="lstyle" title="Tipo de línea del contorno de formas y zonas"><option value="con">Continua</option><option value="par">Gruesa (como pared)</option><option value="dis">Discontinua</option><option value="pun">Punteada</option><option value="mix">Punto y raya</option></select>
      </label>
      <small>Doble clic en un objeto para ponerle etiqueta. Supr borra el objeto seleccionado.</small>
    </div>
  </nav>
  <div id="work">
    <div id="corner">m</div>
    <canvas id="rt"></canvas>
    <canvas id="rl"></canvas>
    <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
    <aside id="plantas" aria-label="Plantas y capas"></aside>
  </div>
</div>
<footer id="status"></footer>
<div id="dlg" class="velo" hidden>
  <div class="caja" role="dialog" aria-modal="true" aria-labelledby="dlgt">
    <h3 id="dlgt">¿Empezar un archivo nuevo?</h3>
    <p>Tienes una topología en el área de trabajo. Si no la guardas, se borrará y no podrás recuperarla.</p>
    <div class="acc">
      <button id="dsave" class="prim">💾 Guardar y empezar nuevo</button>
      <button id="ddisc" class="peligro">Borrar y empezar nuevo</button>
      <button id="dcancel">Cancelar</button>
    </div>
  </div>
</div>
<script src="js/estado.js"></script>
<script src="js/catalogo.js"></script>
<script src="js/dibujo.js"></script>
<script src="js/reglas.js"></script>
<script src="js/rejilla.js"></script>
<script src="js/plantas.js"></script>
<script src="js/historial.js"></script>
<script src="js/iman.js"></script>
<script src="js/nodos.js"></script>
<script src="js/medidas.js"></script>
<script src="js/formas.js"></script>
<script src="js/rotacion.js"></script>
<script src="js/seleccion.js"></script>
<script src="js/interaccion.js"></script>
<script src="js/controles.js"></script>
<script src="js/archivos.js"></script>
<script src="js/main.js"></script>
<script>
// Aviso si faltan los archivos css/ o js/ (por ejemplo, si se descargaron sueltos sin sus carpetas)
if (typeof menu !== 'function') document.body.innerHTML = '<div style="padding:30px;font:16px sans-serif;max-width:600px"><h2>No se encontraron los archivos de la página</h2><p>Esta página necesita las carpetas <b>css</b> y <b>js</b> junto a <b>index.html</b>. Descomprime el .zip completo y abre <b>index.html</b> desde la carpeta Topologias_de_red.</p></div>';
</script>
</body>
</html>
